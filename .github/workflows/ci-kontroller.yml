name: FK Kontroller

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verifiera:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Konfigurera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden (om requirements.txt finns)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Kör hälsotest
        run: python scripts/fk_halsotest.py

      - name: Kör tålighets- och anti-hallucinationskontroll
        run: python scripts/fk_talighets_och_hallucinationskontroll.py
