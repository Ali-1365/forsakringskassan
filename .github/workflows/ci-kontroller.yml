name: FK Kontroller

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verifiera:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v5

      - name: Konfigurera Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          for pkg in faster-whisper fastapi uvicorn pydantic httpx; do
            echo "--- Installerar: $pkg ---"
            pip install "$pkg" || echo "VARNING: Kunde inte installera $pkg"
          done

      - name: Kör hälsotest
        run: python scripts/fk_halsotest.py

      - name: Kör tålighets- och anti-hallucinationskontroll
        run: python scripts/fk_talighets_och_hallucinationskontroll.py
