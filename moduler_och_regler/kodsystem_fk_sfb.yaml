    beskrivning: "Begäran om komplettering"
    mönster: ["begäran om komplettering", "komplettera underlaget", "föreläggande att komplettera"]
    negativa_filter: []
    föreslaget_block: "UTREDNING"
    indikation: "KOMPLETTERING"

  - kod: "FK-02"
