    mönster: ["ansökan inkommen", "ärende inlett", "ansökan om sjukpenning", "ansökan om livränta"]
    negativa_filter: ["ansökan avvisad", "återkallad ansökan"]
    föreslaget_block: "INITIERING"
    indikation: "ARENDE_START"

  - kod: "FK-01"
