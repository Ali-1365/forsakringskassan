# Kodtabell: Försäkringskassan / SFB / FPL — konfigurerbar, ej inbakad i FSM
# version: 1.0
# Träff = sökhjälp. Ingen träff är bevisvärdering eller domslut.

meta:
  domän: FK_SFB
  instans: FORSAKRINGSKASSAN_FORVALTNINGSRATT
  version: "1.0"
  källa: "FL (2017:900), SFB (2010:110), FPL (1971:291)"
  not: >
    Träffar är indikativa. Varje materiell slutsats kräver källkedja.
    AI-01..AI-05 är systemstödskoder, inte automatiska beslut.

