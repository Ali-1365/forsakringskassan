      });

      const allowed = new Set(baseNodes.map(n => n.id));
      if (state.selectedId && nodeMap.has(state.selectedId)) {
        allowed.add(state.selectedId);
        for (const e of RAW.edges) {
          if (e.from === state.selectedId) allowed.add(e.to);
          if (e.to === state.selectedId) allowed.add(e.from);
        }
      }

      let visNodes = [...allowed].map(id => nodeMap.get(id)).filter(Boolean);

      if (q) {
        const matched = new Set(visNodes.filter(n => n.label.toLowerCase().includes(q)).map(n => n.id));
        const expanded = new Set(matched);
        for (const e of RAW.edges) {
          if (matched.has(e.from)) expanded.add(e.to);
          if (matched.has(e.to)) expanded.add(e.from);
        }
        visNodes = visNodes.filter(n => expanded.has(n.id));
      }

      const visIds = new Set(visNodes.map(n => n.id));
      let visEdges = RAW.edges.filter(e => visIds.has(e.from) && visIds.has(e.to));
      if (state.selectedId && visIds.has(state.selectedId)) {
        visEdges = visEdges.filter(e => e.from === state.selectedId || e.to === state.selectedId);
      }

      return { visNodes, visEdges, q };
    }

    const palette = ["#f59e0b", "#38bdf8", "#34d399", "#a78bfa", "#f472b6", "#fb7185", "#facc15", "#2dd4bf", "#fb923c"];
    const folderColorMap = new Map(folders.map((f, idx) => [f, palette[idx % palette.length]]));
    function colorForFolder(f) {
      return folderColorMap.get(f) || "#94a3b8";
    }

    function layoutNodes(visNodes) {
      const groups = new Map();
      for (const n of visNodes) {
        if (!groups.has(n.folder)) groups.set(n.folder, []);
        groups.get(n.folder).push(n);
      }

      const colNames = [...groups.keys()];
      const colSpacing = 310;
      const rowSpacing = 44;
      const maxRowsPerCol = 18;

      let colCursor = 0;
      const placements = [];

      for (const col of colNames) {
        const list = groups.get(col);
        const subCols = Math.max(1, Math.ceil(list.length / maxRowsPerCol));
        for (let sc = 0; sc < subCols; sc++) {
          const slice = list.slice(sc * maxRowsPerCol, (sc + 1) * maxRowsPerCol);
          const startY = -((slice.length - 1) * rowSpacing) / 2;
          slice.forEach((n, ri) => {
            placements.push({ node: n, colIndex: colCursor, x: 0, y: startY + ri * rowSpacing });
          });
          colCursor += 1;
        }
      }

      const totalCols = Math.max(1, colCursor);
      for (const p of placements) {
        p.x = (p.colIndex - (totalCols - 1) / 2) * colSpacing;
        if (!p.node._placed) {
          p.node.x = p.x;
          p.node.y = p.y;
          p.node._placed = true;
        }
      }
    }

    const canvas = document.getElementById("graphCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const wrap = document.getElementById("canvasWrap");
      canvas.width = wrap.clientWidth * window.devicePixelRatio;
      canvas.height = wrap.clientHeight * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function screenToWorld(sx, sy) {
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      return {
        x: (sx - cw / 2 - state.panX) / state.scale,
        y: (sy - ch / 2 - state.panY) / state.scale,
      };
    }

    function nodeRect(n) {
      const w = Math.max(130, Math.min(270, n.name.length * 7.6 + 24));
      const h = 28;
      return { x: n.x - w / 2, y: n.y - h / 2, w, h };
    }

    function cubicBezierPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y,
      };
    }

    function cubicBezierTangent(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return {
        x: 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
        y: 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y),
      };
    }

    function drawGraph() {
      const { visNodes, visEdges, q } = getFilteredGraph();
      layoutNodes(visNodes);
      statsPill.textContent = `Visar ${visNodes.length} noder | ${visEdges.length} kopplingar (totalt ${RAW.nodes.length} / ${RAW.edges.length})`;

      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      ctx.clearRect(0, 0, cw, ch);

      ctx.save();
      ctx.translate(cw / 2 + state.panX, ch / 2 + state.panY);
      ctx.scale(state.scale, state.scale);

      const neighbors = new Set();
      if (state.selectedId) {
        neighbors.add(state.selectedId);
        for (const e of visEdges) {
          if (e.from === state.selectedId) neighbors.add(e.to);
          if (e.to === state.selectedId) neighbors.add(e.from);
        }
      }

      for (const e of visEdges) {
        const a = nodeMap.get(e.from);
        const b = nodeMap.get(e.to);
        if (!a || !b) continue;
        const aRect = nodeRect(a);
        const bRect = nodeRect(b);

        const p0 = { x: a.x >= b.x ? aRect.x : aRect.x + aRect.w, y: a.y };
        const p3 = { x: a.x >= b.x ? bRect.x + bRect.w : bRect.x, y: b.y };
        const dx = Math.abs(p3.x - p0.x);
        const ctrlOffset = Math.max(45, dx * 0.45) * (p3.x >= p0.x ? 1 : -1);
        const p1 = { x: p0.x + ctrlOffset, y: p0.y };
        const p2 = { x: p3.x - ctrlOffset, y: p3.y };

        const isOut = state.selectedId === e.from;
        const isIn = state.selectedId === e.to;
        const highlighted = isOut || isIn || state.hoverId === e.from || state.hoverId === e.to;
        ctx.strokeStyle = isOut ? "#34d399" : isIn ? "#fbbf24" : highlighted ? "#60a5fa" : "rgba(148, 163, 184, 0.22)";
        ctx.lineWidth = highlighted ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
        ctx.stroke();

        if (highlighted) {
          const tip = cubicBezierPoint(p0, p1, p2, p3, 0.92);
          const tan = cubicBezierTangent(p0, p1, p2, p3, 0.92);
          const angle = Math.atan2(tan.y, tan.x);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.beginPath();
          ctx.moveTo(tip.x, tip.y);
          ctx.lineTo(tip.x - 9 * Math.cos(angle - 0.38), tip.y - 9 * Math.sin(angle - 0.38));
          ctx.lineTo(tip.x - 9 * Math.cos(angle + 0.38), tip.y - 9 * Math.sin(angle + 0.38));
          ctx.closePath();
          ctx.fill();
        }
      }

      for (const n of visNodes) {
        const r = nodeRect(n);
        const isSelected = n.id === state.selectedId;
        const isHover = n.id === state.hoverId;
        const isMatch = Boolean(q && n.label.toLowerCase().includes(q));
        const dimmed = Boolean(state.selectedId && !neighbors.has(n.id));

        ctx.globalAlpha = dimmed ? 0.25 : 1;
        ctx.fillStyle = isSelected ? "#1d4ed8" : isMatch ? "#312e81" : "#1e293b";
        ctx.strokeStyle = isSelected ? "#93c5fd" : isHover ? "#f8fafc" : colorForFolder(n.folder);
        ctx.lineWidth = isSelected || isHover ? 2.5 : 1.5;

        ctx.beginPath();
        ctx.roundRect(r.x, r.y, r.w, r.h, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#f8fafc";
        ctx.font = isSelected ? "600 12px system-ui, sans-serif" : "12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const text = r.w < n.name.length * 7.6 + 24 ? n.name.slice(0, 26) + "…" : n.name;
        ctx.fillText(text, n.x, n.y);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      document.getElementById("zoomLabel").textContent = `${Math.round(state.scale * 100)}%`;
    }

    function hitTest(sx, sy) {
      const w = screenToWorld(sx, sy);
      const { visNodes } = getFilteredGraph();
      for (let i = visNodes.length - 1; i >= 0; i--) {
        const n = visNodes[i];
        const r = nodeRect(n);
        if (w.x >= r.x && w.x <= r.x + r.w && w.y >= r.y && w.y <= r.y + r.h) {
          return n.id;
        }
      }
      return null;
    }

    function renderInspector() {
      const titleEl = document.getElementById("inspTitle");
      const metaEl = document.getElementById("inspMeta");
      const outEl = document.getElementById("inspOut");
      const inEl = document.getElementById("inspIn");
      const clearBtn = document.getElementById("clearFocusBtn");

      if (!state.selectedId || !nodeMap.has(state.selectedId)) {
        titleEl.textContent = "Ingen nod vald";
        metaEl.textContent = "Klicka på en filnod i grafen för att se inkommande och utgående kopplingar.";
        clearBtn.style.display = "none";
        outEl.innerHTML = "";
        inEl.innerHTML = "";
        return;
      }

      const n = nodeMap.get(state.selectedId);
      const outgoing = RAW.edges.filter(e => e.from === n.id).map(e => nodeMap.get(e.to)).filter(Boolean);
      const incoming = RAW.edges.filter(e => e.to === n.id).map(e => nodeMap.get(e.from)).filter(Boolean);

      titleEl.textContent = n.label;
      metaEl.textContent = `Mapp: ${n.folder} | Utgående: ${outgoing.length} | Inkommande: ${incoming.length}`;
      clearBtn.style.display = "inline-block";

      outEl.innerHTML = `<div class="list-title">Utgående kopplingar (${outgoing.length})</div>` +
        (outgoing.length ? outgoing.map(t => `<button class="item-link" data-jump="${escapeHtml(t.id)}">${escapeHtml(t.label)}</button>`).join("") : `<div class="muted">Inga utgående kopplingar</div>`);

      inEl.innerHTML = `<div class="list-title">Inkommande kopplingar (${incoming.length})</div>` +
        (incoming.length ? incoming.map(s => `<button class="item-link" data-jump="${escapeHtml(s.id)}">${escapeHtml(s.label)}</button>`).join("") : `<div class="muted">Inga inkommande kopplingar</div>`);

      document.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => {
          focusNode(btn.dataset.jump);
        });
      });
    }

    function focusNode(id) {
      state.selectedId = id;
      const { visNodes } = getFilteredGraph();
      layoutNodes(visNodes);
      const n = nodeMap.get(id);
      if (n) {
        state.panX = -n.x * state.scale;
        state.panY = -n.y * state.scale;
      }
      renderInspector();
      drawGraph();
    }

    canvas.addEventListener("mousedown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const hit = hitTest(sx, sy);
      state.lastX = sx;
      state.lastY = sy;
      state.dragMoved = false;
      if (hit) {
        state.dragNodeId = hit;
      } else {
        state.isPanning = true;
        canvas.classList.add("dragging");
      }
    });

    window.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const dx = sx - state.lastX;
      const dy = sy - state.lastY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) state.dragMoved = true;

      if (state.dragNodeId) {
        const n = nodeMap.get(state.dragNodeId);
        if (n) {
          n.x += dx / state.scale;
          n.y += dy / state.scale;
          n._placed = true;
          drawGraph();
        }
      } else if (state.isPanning) {
        state.panX += dx;
        state.panY += dy;
        drawGraph();
      } else {
        const hover = hitTest(sx, sy);
        if (hover !== state.hoverId) {
          state.hoverId = hover;
          drawGraph();
        }
      }
      state.lastX = sx;
      state.lastY = sy;
    });

    window.addEventListener("mouseup", () => {
      if (state.dragNodeId && !state.dragMoved) {
        state.selectedId = state.selectedId === state.dragNodeId ? null : state.dragNodeId;
        renderInspector();
        drawGraph();
      }
      state.dragNodeId = null;
      state.isPanning = false;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      state.scale = Math.max(0.2, Math.min(3.5, state.scale * factor));
      drawGraph();
    }, { passive: false });

    function renderLayerView() {
      const q = state.search.trim().toLowerCase();
      const mat = new Map();
      for (const f of folders) mat.set(f, new Map(folders.map(t => [t, 0])));
      for (const e of RAW.edges) {
        const sf = nodeMap.get(e.from)?.folder;
        const tf = nodeMap.get(e.to)?.folder;
        if (sf && tf) mat.get(sf).set(tf, (mat.get(sf).get(tf) || 0) + 1);
      }

      const ths = folders.map(f => `<th>${escapeHtml(f === "." ? "." : f)}</th>`).join("");
      const rows = folders.map(sf => {
        const cells = folders.map(tf => {
          const c = mat.get(sf).get(tf) || 0;
          return `<td>${c > 0 ? `<strong>${c}</strong>` : `<span class="muted">0</span>`}</td>`;
        }).join("");
        return `<tr><td><strong>${escapeHtml(sf === "." ? "." : sf)}</strong></td>${cells}</tr>`;
      }).join("");

      document.getElementById("matrixWrap").innerHTML = `
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Från \ Till</th>${ths}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;

      const visibleFolders = state.folder === "__ALL__" ? folders : [state.folder];
      const cardsHtml = visibleFolders.map(f => {
        const fNodes = RAW.nodes.filter(n => n.folder === f && (!q || n.label.toLowerCase().includes(q)));
        const fEdges = RAW.edges.filter(e => nodeMap.get(e.from)?.folder === f || nodeMap.get(e.to)?.folder === f);
        const rowsHtml = fNodes.map(n => {
          const outC = RAW.edges.filter(e => e.from === n.id).length;
          const inC = RAW.edges.filter(e => e.to === n.id).length;
          return `
            <div class="file-row">
              <div class="file-row-top">
                <button class="item-link" style="border:none;background:none;padding:0;font-weight:600;" data-open-graph="${escapeHtml(n.id)}">${escapeHtml(n.label)}</button>
                <span><span class="badge">ut: ${outC}</span> <span class="badge">in: ${inC}</span></span>
              </div>
            </div>`;
        }).join("");

        return `
          <div class="card">
            <div class="card-header" data-toggle-card="${escapeHtml(f)}">
              <div class="card-title">${escapeHtml(f === "." ? ". (rotmapp)" : f)}</div>
              <span class="badge">${fNodes.length} filer | ${fEdges.length} berörda kopplingar</span>
            </div>
            <div class="card-body" id="card_${escapeHtml(f)}">
              ${rowsHtml || `<div class="muted">Inga matchande filer</div>`}
            </div>
          </div>`;
      }).join("");

      document.getElementById("folderCards").innerHTML = cardsHtml;
      document.querySelectorAll("[data-toggle-card]").forEach(el => {
        el.addEventListener("click", () => {
          const body = document.getElementById("card_" + el.dataset.toggleCard);
          if (body) body.classList.toggle("collapsed");
        });
      });
      document.querySelectorAll("[data-open-graph]").forEach(btn => {
        btn.addEventListener("click", () => {
          setView("graph");
          focusNode(btn.dataset.openGraph);
        });
      });
    }

    function setView(v) {
      state.view = v;
      document.getElementById("tabGraph").classList.toggle("active", v === "graph");
      document.getElementById("tabLayers").classList.toggle("active", v === "layers");
      document.getElementById("graphView").style.display = v === "graph" ? "flex" : "none";
      document.getElementById("layerView").style.display = v === "layers" ? "flex" : "none";
      if (v === "graph") {
        resizeCanvas();
        drawGraph();
      } else {
        renderLayerView();
      }
    }

    document.getElementById("tabGraph").addEventListener("click", () => setView("graph"));
    document.getElementById("tabLayers").addEventListener("click", () => setView("layers"));
    document.getElementById("clearFocusBtn").addEventListener("click", () => {
      state.selectedId = null;
      renderInspector();
      drawGraph();
    });
    document.getElementById("resetViewBtn").addEventListener("click", () => {
      state.panX = 0;
      state.panY = 0;
      state.scale = 1;
      state.selectedId = null;
      state.search = "";
      searchInput.value = "";
      state.folder = "__ALL__";
      folderSelect.value = "__ALL__";
      renderInspector();
      if (state.view === "graph") drawGraph(); else renderLayerView();
    });

    searchInput.addEventListener("input", () => {
      state.search = searchInput.value;
      if (state.view === "graph") drawGraph(); else renderLayerView();
    });
    folderSelect.addEventListener("change", () => {
      state.folder = folderSelect.value;
      if (state.view === "graph") drawGraph(); else renderLayerView();
    });
    hideHubsCheckbox.addEventListener("change", () => {
      state.hideHubs = hideHubsCheckbox.checked;
      drawGraph();
    });
    hubThresholdInput.addEventListener("change", () => {
      state.hubThreshold = Math.max(1, parseInt(hubThresholdInput.value || "35", 10));
      drawGraph();
    });

    renderInspector();
    drawGraph();
  </script>
</body>
</html>
