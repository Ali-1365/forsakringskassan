# Kanoniskt ärenderegister — SFCAE
# Primär källa för ärenderegistrering.
# session_context.py läser detta som fallback när ingen runtime-JSON finns.
#
# Klassificering per post:
#   AKTIVERAD      — verifierad runtime-aktivering (kräver bevis)
#   REGISTRERAD    — känt i systemet, resurser saknas delvis eller källfiler ej tillgängliga
#   HISTORISK      — verifierat avslutat ärende
#   BLOCKERAD      — identifierat blockerande hinder
#   EJ_VERIFIERAT  — otillräckligt underlag för statusklassning
#
# Ägandeskap: SYSTEM_RESOURCE / CASE_METADATA (ej privat sakhandling)
# Privat källmaterial lagras INTE i detta register.
# Ärendespecifika resurser länkas via extra.case_resources (runtime).
#
# version: 1.0

