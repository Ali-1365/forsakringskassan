    beskrivning: "Förverkande"
    mönster:
      - "förverkande"
      - "12 kap. 42"
      - "JB 12:42"
    negativa_filter: []
    föreslaget_block: "REKVISIT"
    indikation: "INDIKATIV_ENDAST"

  - kod: "RB_13_3"
