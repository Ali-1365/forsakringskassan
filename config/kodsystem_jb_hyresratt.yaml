# kodsystem_jb_hyresratt.yaml
# Lokalhyra / JB 12 kap. — INDIKATIV mönstermatchning
# Inga partsnamn, inga belopp som facit, ingen automatisk ogiltigförklaring.
version: "1.0"
meta:
  domän: JB_HYRESRATT
  processordning: RB
  provisional_output_only: true
  zero_inference: true
  not: >
    Träffar är sökhjälp. JB 12:58 m.m. kräver källkedja i akt.
    Systemet avgör inte uppsägnings giltighet automatiskt.

koder:
  - kod: "JB_12_58"
    lagrum: "12 kap. 58 § JB"
    beskrivning: "Formkrav vid uppsägning — villkor/delgivning"
    mönster:
      - "12 kap. 58"
      - "JB 12:58"
      - "uppsägning"
      - "villkor för uppsägning"
      - "svarsfrist"
    negativa_filter: []
    föreslaget_block: "PROCESS"
    indikation: "INDIKATIV_ENDAST"

  - kod: "JB_12_57"
    lagrum: "12 kap. 57 § JB"
    beskrivning: "Skadestånd vid uppsägning / indirekt besittningsskydd"
    mönster:
      - "12 kap. 57"
      - "JB 12:57"
      - "indirekt besittningsskydd"
      - "skadestånd hyra"
    negativa_filter: []
    föreslaget_block: "ERSATTNING"
    indikation: "INDIKATIV_ENDAST"

  - kod: "JB_12_42"
