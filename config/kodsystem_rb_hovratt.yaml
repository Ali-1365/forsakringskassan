      - "domstol"
      - "vittne"
      - "förklaring"
    negativa_filter:
      - "inte ljög"
      - "sanningsenlig"
    föreslaget_block: "RÄTTSLIG_BEDÖMNING"
    indikation: "MENED_KONTROLL"

  - kod: "VITNESMÅLSKONTRAST"
    lagrum: "RB 35 kap."
    beskrivning: "Motsägelser i vittnesmål"
    mönster:
      - "vittnet ljög"
      - "motsägelse i vittnesmål"
      - "avvek från"
      - "vittnet inte stämde"
    validering:
      - "vittne"
      - "utsaga"
      - "berättelse"
      - "förklaring"
    negativa_filter:
      - "vittnet talade sanning"
      - "stämde överens"
    föreslaget_block: "RÄTTSLIG_BEDÖMNING"
    indikation: "VITTNESMÅL_KONTROLL"

  - kod: "VÅRDSLÖS_PROCESS"
    lagrum: "RB 18:7"
    beskrivning: "Vårdslös processföring"
    mönster:
      - "vårdslös processföring"
      - "uppenbart ogrundad talan"
      - "vårdslöshet i process"
    validering:
      - "process"
      - "talan"
      - "tingsrätt"
      - "domstol"
    negativa_filter:
      - "inte vårdslös"
      - "välgrundad talan"
    föreslaget_block: "RÄTTEGÅNGSKOSTNADER"
    indikation: "VÅRDSLÖS_PROCESS_KONTROLL"

  - kod: "RÄTTEGÅNGSKOSTNADER_KRAV"
    lagrum: "RB 18 kap."
    beskrivning: "Krav på rättegångskostnader"
    mönster:
      - "rättegångskostnad"
      - "ersättning för rättegångskostnader"
      - "ersättning för kostnader"
      - "ombudsarvode"
    validering:
      - "ersättning"
      - "kostnad"
      - "yrka"
      - "utge"
    negativa_filter:
      - "inga kostnader"
      - "avslå kostnader"
    föreslaget_block: "YRKANDEN"
    indikation: "RÄTTEGÅNGSKOSTNADER_KONTROLL"


