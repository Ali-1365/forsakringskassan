standardrekvisit:
  FK_SFB:
  - Arbetsförmåga styrkt
  - SGI korrekt beräknad
  - Utredningsskyldighet uppfylld (FL 23 §)
  - Kommunikation genomförd (FL 25 §)
  SOL_LVU:
  - Behovsbedömning genomförd
  - Biståndsskäl föreligger (SoL 4 kap. 1 §)
  - Proportionalitet bedömd
  - Utredningsskyldighet uppfylld
  RB_TVIST:
  - Talerätt föreligger
  - Bevisbörda uppfylld
  - Forumrätt korrekt
  KL_KONKURS:
  - Insolvens styrkt
  - Återvinningsgrund föreligger
  FK_ARBETSSKADA:
  - Orsakssamband arbete–skada (SFB 39 kap.)
  - Medicinskt underlag för skada
  - Utredningsskyldighet FL 23 § / SFB 110:13 §
  FK_LIVRANTA:
  - Inkomstförlust minst 1/15 (SFB 26:17 §)
  - Varaktighet mer än 1 år
  - Nackdelsförbud SFB 113:8 §
  PATIENTSKADA_CRPS:
  - CRPS enligt Budapestkriterierna
  - Orsakssamband vård–skada (Patientskadelagen)
  - Eventuell fördröjd diagnos (HFD 2018 ref. 3)
